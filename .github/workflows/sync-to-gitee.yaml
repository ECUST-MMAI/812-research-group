name: Sync GitHub to Gitee
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15  # 增加整体超时时间
    
    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取完整历史
          
      - name: Configure Git with Network Optimizations
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
          # 核心网络优化配置
          git config --global http.postBuffer 1048576000  # 1GB缓冲区
          git config --global http.lowSpeedLimit 1000
          git config --global http.lowSpeedTime 300
          git config --global http.timeout 60
          git config --global https.timeout 60
          
          # 显式配置Gitee IP地址，避免DNS解析问题
          git config --global url."https://180.76.198.77/".insteadOf "https://gitee.com/"
          
          # 其他优化
          git config --global core.compression 6  # 平衡压缩率和速度
          git config --global pack.windowMemory "100m"
          git config --global pack.packSizeLimit "100m"
          
      - name: Direct Push to Gitee IP (Bypass DNS)
        timeout-minutes: 12  # 增加推送步骤超时时间
        env:
          GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
        run: |
          echo "Starting Gitee push with direct IP access..."
          
          # 使用已验证的Gitee IP地址
          GITEE_IP="180.76.198.77"
          GITEE_REPO="ecust-mmai/812-research-group.git"
          
          # 重试函数，增加重试次数和调整延迟策略
          retry_push() {
            local retries=5
            local count=0
            local delay=3
            
            while [ $count -lt $retries ]; do
              echo "Attempt $((count + 1)) of $retries..."
              
              # 直接使用IP地址访问，避免DNS问题
              git push -f "https://oauth2:${{ secrets.GITEE_ACCESS_TOKEN }}@${GITEE_IP}/${GITEE_REPO}" main:main
              
              if [ $? -eq 0 ]; then
                echo "Push successful!"
                return 0
              fi
              
              echo "Push failed, retrying in $delay seconds..."
              sleep $delay
              count=$((count + 1))
              delay=$((delay + 2))  # 线性退避，每次增加2秒
            done
            
            echo "All push attempts failed!"
            return 1
          }
          
          # 执行重试推送
          retry_push
          
      - name: Verify Sync Success
        if: ${{ success() }}
        run: |
          echo "Sync completed successfully!"
          # 验证Gitee仓库HEAD提交
          git ls-remote https://oauth2:${{ secrets.GITEE_ACCESS_TOKEN }}@gitee.com/ecust-mmai/812-research-group.git HEAD