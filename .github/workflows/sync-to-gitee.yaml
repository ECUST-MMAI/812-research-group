name: Sync GitHub to Gitee
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # 整个作业超时设置
    
    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取完整历史
          
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          # 优化Git配置，提高传输效率
          git config --global http.postBuffer 524288000  # 500MB
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          git config --global core.compression 9
          # 配置Gitee IP地址，避免DNS解析问题
          git config --global url."https://gitee.com/".insteadOf "https://180.76.198.77/"
          
      - name: Optional Network Test (Allowed to Fail)
        continue-on-error: true
        run: |
          echo "Testing network connectivity (this might fail but that's okay)..."
          # 尝试多种网络测试方法
          curl -I --connect-timeout 5 https://gitee.com || echo "curl failed, but continuing..."
          nslookup gitee.com || echo "nslookup failed, but continuing..."
          
      - name: Push to Gitee with Retry
        timeout-minutes: 8  # 单个步骤超时设置
        env:
          GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
        run: |
          echo "Starting Gitee push with retry mechanism..."
          
          # 重试函数
          retry_push() {
            local retries=3
            local count=0
            local delay=5
            
            while [ $count -lt $retries ]; do
              echo "Attempt $((count + 1)) of $retries..."
              
              # 简化推送命令，减少可能的问题点
              git push -f "https://oauth2:${{ secrets.GITEE_ACCESS_TOKEN }}@gitee.com/ecust-mmai/812-research-group.git" main:main
              
              if [ $? -eq 0 ]; then
                echo "Push successful!"
                return 0
              fi
              
              echo "Push failed, retrying in $delay seconds..."
              sleep $delay
              count=$((count + 1))
              delay=$((delay * 2))  # 指数退避
            done
            
            echo "All push attempts failed!"
            return 1
          }
          
          # 执行重试推送
          retry_push
          
      - name: Verify Sync Success
        if: ${{ success() }}
        run: |
          echo "Sync completed successfully!"
          # 验证Gitee仓库HEAD提交
          git ls-remote https://oauth2:${{ secrets.GITEE_ACCESS_TOKEN }}@gitee.com/ecust-mmai/812-research-group.git HEAD