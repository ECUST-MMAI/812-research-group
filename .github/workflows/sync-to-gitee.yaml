name: Sync GitHub to Gitee
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取完整历史
          
      - name: Trust Workspace Directory
        run: |
          git config --global --add safe.directory /github/workspace
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          
      - name: Debug SSH Configuration
        run: |
          echo "Checking SSH directory..."
          ls -la ~/.ssh
          echo "Checking Git configuration..."
          git config --list
          
      - name: Setup SSH for Gitee
        run: |
          mkdir -p ~/.ssh
          # 确保密钥格式正确（处理可能的换行符问题）
          echo "${{ secrets.GITEE_RSA_PRIVATE_KEY }}" | sed 's/\\n/\n/g' > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          # 添加Gitee到已知主机
          ssh-keyscan -H gitee.com >> ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts
          # 测试SSH连接
          echo "Testing SSH connection to Gitee..."
          ssh -T git@gitee.com || echo "SSH connection test completed (expected error if first connection)"
          
      - name: Add Gitee Remote
        run: |
          git remote add gitee git@gitee.com:ecust-mmai/812-research-group.git
          git remote -v  # 验证远程仓库设置
          
      - name: Push to Gitee with SSH
        run: |
          echo "Pushing to Gitee..."
          git push -f gitee main:main
          
      - name: Fallback to HTTPS if SSH fails
        if: failure()
        run: |
          echo "SSH push failed, trying HTTPS..."
          git remote remove gitee
          # 使用用户名和访问令牌的HTTPS方式
          git remote add gitee https://ecust-mmai:${{ secrets.GITEE_ACCESS_TOKEN }}@gitee.com/ecust-mmai/812-research-group.git
          git push -f gitee main:main