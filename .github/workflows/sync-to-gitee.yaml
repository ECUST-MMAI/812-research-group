name: Sync GitHub to Gitee
on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10  # 整个作业超时设置
    
    steps:
      - name: Checkout GitHub Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 拉取完整历史
          
      - name: Configure Git
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          # 优化Git配置，提高传输效率
          git config --global http.postBuffer 524288000  # 500MB
          git config --global http.lowSpeedLimit 0
          git config --global http.lowSpeedTime 999999
          git config --global core.compression 9
          
      - name: Network Test
        run: |
          echo "Testing network connectivity..."
          ping -c 3 gitee.com
          echo "Checking Gitee SSH port..."
          nc -zv gitee.com 22
          echo "Checking Gitee HTTPS port..."
          nc -zv gitee.com 443
          
      - name: Push to Gitee with Debug Info
        timeout-minutes: 5  # 单个步骤超时设置
        env:
          GITEE_ACCESS_TOKEN: ${{ secrets.GITEE_ACCESS_TOKEN }}
        run: |
          echo "Starting Gitee push..."
          # 启用Git详细日志
          export GIT_CURL_VERBOSE=1
          export GIT_TRACE=1
          
          # 测试远程连接
          git ls-remote https://oauth2:${{ secrets.GITEE_ACCESS_TOKEN }}@gitee.com/ecust-mmai/812-research-group.git
          
          # 使用--progress显示进度，--verbose显示详细信息
          git push --verbose --progress -f https://oauth2:${{ secrets.GITEE_ACCESS_TOKEN }}@gitee.com/ecust-mmai/812-research-group.git main:main
          
      - name: Verify Sync Success
        if: ${{ success() }}
        run: |
          echo "Sync completed successfully!"
          # 验证Gitee仓库HEAD提交
          git ls-remote https://oauth2:${{ secrets.GITEE_ACCESS_TOKEN }}@gitee.com/ecust-mmai/812-research-group.git HEAD