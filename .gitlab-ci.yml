# Gitee CI/CD configuration for Hugo website deployment to Gitee Pages
# This file will be automatically recognized by Gitee CI/CD

stages:
  - build
  - deploy

variables:
  WC_HUGO_VERSION: '0.119.0'
  # Replace with your Gitee Pages URL
  GITEE_PAGES_URL: 'https://ecust-mmai.gitee.io/812-research-group/'
  # The branch where Hugo will build the website
  PAGES_BRANCH: 'gh-pages'

# Build stage
build:
  stage: build
  image: ubuntu:latest
  script:
    # Update system packages
    - apt-get update -y
    # Install dependencies
    - apt-get install -y wget git
    # Install Go (required for Hugo modules)
    - apt-get install -y golang-go
    # Download and install Hugo
    - wget -q https://github.com/gohugoio/hugo/releases/download/v${WC_HUGO_VERSION}/hugo_extended_${WC_HUGO_VERSION}_Linux-64bit.tar.gz
    - tar -xzf hugo_extended_${WC_HUGO_VERSION}_Linux-64bit.tar.gz
    - mv hugo /usr/local/bin/
    - hugo version
    # Clone the repository with full history
    - git checkout $CI_COMMIT_REF_NAME
    - git submodule update --init --recursive
    # Build the website
    - hugo --minify --baseURL "${GITEE_PAGES_URL}"
  artifacts:
    paths:
      - public/
    expire_in: 1 week

# Deploy stage
deploy:
  stage: deploy
  image: ubuntu:latest
  script:
    # Install git
    - apt-get update -y
    - apt-get install -y git
    # Configure git
    - git config --global user.name "CI/CD Bot"
    - git config --global user.email "ci-cd-bot@example.com"
    # Create a temporary directory for deployment
    - mkdir -p deploy
    - cd deploy
    # Initialize a new git repo
    - git init
    - git remote add origin https://gitee.com/${CI_PROJECT_PATH}.git
    # Checkout the pages branch if it exists, otherwise create it
    - git fetch origin ${PAGES_BRANCH} || git checkout -b ${PAGES_BRANCH}
    # Copy the built website to the deployment directory
    - cp -r ../public/* .
    # Add and commit the changes
    - git add .
    - git commit -m "Deploy website from CI/CD: ${CI_COMMIT_SHA}"
    # Push to the pages branch
    - git push -f origin ${PAGES_BRANCH}
  dependencies:
    - build
  only:
    - main  # Only deploy when pushing to main branch